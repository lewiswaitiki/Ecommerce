<!--templates/home.html-->
{%extends "base.html"%}
{%block title%}Home{%endblock%}
{%block content%}
  <h2>Home</h2>
  <h3>Products</h3>
  <ul class="product-list">
    {% for product in products %}
    <li class="product-item">
      <img src="{{ url_for('static', filename=product[5][7:]) }}" alt="{{ product[1] }}" class="product-image" width="100"> 
      <div class="product-info">
        <strong>{{ product[1] }}</strong> - ${{ product[3] }} ({{ product[4] }} in stock)<br> 
        <span class="product-category">Category: {{ product[6] }}</span><br>
        <p class="product-description">{{ product[2] }}</p>
      </div>
    </li>
    {% endfor %}
  </ul>
{%endblock%}
