{% extends "base.html" %}
{%block title%}Profile {%endblock%}
{%block content%}
<h2>User Profile</h2>
<form action ={{url_for('profile')}} method = "POST" class="profile-form">
  <div class="form-group">
    <label for='username'>Username:</label>
    <input type ="text" name="username" id="username" class="form-control" value="{{user[0]}}" required><br>
  </div>
  <div class="form-group">
    <label for='email'>Email:</label>
    <input type="email" name="email" class="form-control" id="email" value="{{user[1]}}" required><br>
  </div>
  <button type="submit" class="btn">Update profile</button>
</form>
{%endblock%}
