{% extends "base.html" %}
{%block title%}Products{%endblock%}
{% block content %}
  <h2>Products</h2>
  <table class="product-table">
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Description</th>
        <th>price</th>
        <th>stock</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      {%for product in products%}
      <tr>
        <td><img src="{{url_for('static',filename=product[5][7:])}}" alt="{{product[1]}}" width="30" class="product-image"></td>
        <td>{{product[1]}}</td>
        <td>{{product[2]}}</td>
        <td>{{product[3]}}</td>
        <td>{{product[4]}}</td>
        <td>{{product[6]}}</td>
      </tr>
      {%endfor%}
    </tbody>
  </table>
  {% endblock %}
