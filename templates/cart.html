<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Store - Products</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">
</head>
<body>
    <header>
      <div class="header-container">
          <h1>Unity Store</h1>
          <nav>
              <ul>
                  <li><a href="{{url_for('home')}}"><i class="fas fa-home"></i> Home</a></li>
                  <li><a href="{{url_for('view_cart')}}"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-count">{{item_count}}</span></a></li>
                  <li><a href="orders.html"><i class="fas fa-shopping-bag"></i> Orders</a></li>
                  <li><a href="{{url_for('checkout')}}"><i class="fas fa-credit-card"></i> Checkout</a></li>       
              </ul>
          </nav>
      </div>
    </header>

    <div class="cart-container">
      <div class="status">
        <i class="fa-solid fa-cart-shopping">cart......</i>  
        <i class="fa-regular fa-credit-card">checkout.....</i>
        <i class="fa-solid fa-list-check">Order</i>
      </div>
      <div class="cart-content">
        <div class="details">
          {% for item in cart_items %}
          <div class="item-card">
              <img src="{{url_for('static', filename=item[2][7:])}}" alt="image">
              <h3>{{item[0]}}</h3>
              <div class="quantity-control">
                          <button class="qty-btn minus" data-product="{{item[4]}}">-</button>
                          <input type="number" class="quantity-input" value="{{item[3]}}" min="1" max="" data-product="{{item[4]}}"  data-price="{{ item[1] }}">
                          <button class="qty-btn plus" data-product="{{item[4]}}">+</button>
              </div>
              <!--span class="current-price">Ksh {{item[1]}}</span-->
              <span class="current-price">Ksh {{item[1]}}</span>
              <span class="item-total" data-product="{{ item[4] }}">
                  Ksh {{ item[1] * item[3] }}
              </span>
              <i class="fa-solid fa-trash-can" data-product="{{item[4]}}"></i>
          </div>
          {% endfor %}
      </div>
      <div class="order-details">
          <p>Order summary</p>
          <!--p class="total">Total: Ksh {{ total }}</p -->
          <p class="cart-total">Total: Ksh {{ total }}</p>
          <button id="checkout-btn">Checkout</button>
      </div>
    </div>


    <script src="{{url_for('static',filename='js/cart.js')}}"></script>
</body>
</html>
