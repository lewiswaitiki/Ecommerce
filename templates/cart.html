{% extends "base.html" %}
{%block title%}Cart{%endblock%}
{%block content%}
<h2>Shopping Cart</h2>
<ul class="cart-list">
  {%for product ,quantity in products%}
  <li class="cart-item">
    <img src="{{url_for('static',filename=product[5][7:])}}" alt="{{product[1]}}"  class="cart-image"> 
    <div class="cart-info">
      <strong>{{product[1]}}</strong> - ${{product[3]}}<br>
      <span class="cart-category">Category: {{product[6]}}</span> <br>
      <p class="cart-description">{{product[2]}}</p>
      <p class="cart-quantity">Quantity: {{quantity}} </p>
      <div class="cart-actions">  
      <a href="{{url_for('remove_from_cart',product_id=product[0])}}" class="btn btn-remove">Remove</a>
      <form action="{{url_for('update_quantity',product_id = product[0])}}" method= "POST" class="quantity-form">
        <input type ="number" name="quantity" value="{{quantity}}" min="1" class="quantity-input">
        <button type="submit" class="btn btn-update">Update</button>
      </form>
      </div>
    </div>
  </li>
{%endfor%}
</ul>
{%endblock%}
